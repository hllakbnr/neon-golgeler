<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Neon Gölgeler</title>

<style>
:root{--neon:#ff2fd6;--cyan:#20f0ff;--lime:#b6ff3b;--amber:#ffb020;--bg:rgba(10,6,30,.82);--panel:rgba(18,10,44,.94);--txt:#f4f0ff;--dim:#a99fd0;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05030f;color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:var(--txt);background:linear-gradient(180deg,#3a1f7a,#25104f);border:2px solid #6c46d8;border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 #120830}
button:hover{border-color:var(--cyan)}
button:active{transform:translateY(2px);box-shadow:none}
button.alt{background:linear-gradient(180deg,#0d4a5a,#082d38);border-color:#1aa9c0}
button.warn{background:linear-gradient(180deg,#7a1f3a,#4f1025);border-color:#d8466c}
input,select,textarea{font:inherit;color:var(--txt);background:#160c38;border:1px solid #5a3cb8;border-radius:8px;padding:6px 8px}
textarea{width:100%;min-height:160px;font-family:Consolas,monospace;font-size:12px;user-select:text;-webkit-user-select:text}
/* Yükleme & ana menü */
#loading,#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;background:radial-gradient(ellipse at 50% 30%,#3b0f6e 0%,#0b0620 60%,#05030f 100%)}
#loading .bar{width:min(420px,80vw);height:14px;border-radius:8px;background:#1b1040;overflow:hidden;border:1px solid #6c46d8;margin-top:18px}
#loading .fill{height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--cyan));transition:width .2s}
.logo{font-size:clamp(38px,8vw,84px);font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 12px var(--neon),0 0 32px var(--neon),0 0 60px #7a1fff;transform:skew(-6deg)}
.logo span{color:var(--cyan);text-shadow:0 0 12px var(--cyan),0 0 40px var(--cyan)}
.sub{color:var(--dim);margin-top:6px;letter-spacing:4px;font-size:13px}
#title .menu{display:flex;flex-direction:column;gap:12px;margin-top:34px;width:min(320px,80vw)}
#title .menu button{font-size:18px;padding:12px}
#title .foot{position:absolute;bottom:14px;color:var(--dim);font-size:12px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#stats{position:absolute;left:14px;top:12px;width:250px}
.barw{height:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25);border-radius:7px;overflow:hidden;margin-bottom:5px}
.barw div{height:100%;transition:width .15s}
#hpb{background:linear-gradient(90deg,#ff3b6b,#ff7a3b)} #enb{background:linear-gradient(90deg,#20f0ff,#7a5cff)}
#bondb{background:linear-gradient(90deg,#ff7ad9,#ffb020)}
#statline{font-size:13px;text-shadow:0 1px 2px #000;line-height:1.5}
#topright{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#wanted{font-size:22px;letter-spacing:2px;color:#444;text-shadow:0 0 4px #000}
#wanted .on{color:#ffd23b;text-shadow:0 0 10px #ffb020}
#wanted.flash{animation:fl .5s infinite alternate}
@keyframes fl{to{filter:brightness(1.8)}}
#clock{font-size:13px;background:var(--bg);padding:3px 10px;border-radius:10px}
#minimap{width:170px;height:170px;border-radius:50%;border:3px solid #6c46d8;box-shadow:0 0 16px #6c46d8;background:#0b0620}
#objective{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:52vw;text-align:center;background:var(--bg);padding:7px 16px;border-radius:12px;border:1px solid #6c46d8;font-size:14px}
#objective:empty{display:none}
#prompt{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);background:var(--bg);padding:8px 16px;border-radius:12px;border:1px solid var(--cyan);font-size:15px}
#prompt:empty{display:none}
#toasts{position:absolute;left:50%;top:64px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--panel);border:1px solid var(--neon);padding:8px 16px;border-radius:12px;font-size:14px;animation:tin .3s ease-out}
.toast.big{font-size:22px;font-weight:800;border-color:var(--amber);text-shadow:0 0 10px var(--amber)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
#radio{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:6px 14px;border-radius:10px;font-size:13px;color:#ffe9a8;max-width:70vw}
#radio:empty{display:none}
#speedo{position:absolute;right:16px;bottom:200px;font-size:28px;font-weight:800;text-shadow:0 0 8px var(--cyan)}
#speedo:empty{display:none}
#weaponhud{position:absolute;left:14px;top:150px;font-size:13px;background:var(--bg);padding:4px 10px;border-radius:10px}
#hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--dim);max-width:46vw;text-shadow:0 1px 2px #000}
#fps{position:absolute;right:12px;bottom:8px;font-size:11px;color:var(--dim)}
#bossbar{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:min(520px,70vw);text-align:center;font-size:13px}
#bossbar .barw{height:14px} #bossb{background:linear-gradient(90deg,#ff2fd6,#ff3b3b)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:30}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:29}
/* Sinematik */
#cine{position:fixed;inset:0;pointer-events:none;z-index:25}
#cine .bar{position:absolute;left:0;right:0;height:11vh;background:#000;transition:transform .5s}
#cine .top{top:0;transform:translateY(-100%)} #cine .bot{bottom:0;transform:translateY(100%)}
#cine.on .top,#cine.on .bot{transform:none}
#cine .sub{position:absolute;bottom:13vh;left:50%;transform:translateX(-50%);width:min(860px,90vw);text-align:center;font-size:clamp(15px,2.2vw,21px);letter-spacing:0;color:#fff;text-shadow:0 2px 4px #000,0 0 8px #000}
#cine .sub b{color:var(--cyan)}
#cine .skip{position:absolute;right:16px;top:12vh;pointer-events:auto;font-size:13px;opacity:.8}
#cine .ctitle{position:absolute;top:30%;width:100%;text-align:center;font-size:clamp(26px,5vw,52px);font-weight:900;text-shadow:0 0 18px var(--neon);opacity:0;transition:opacity .8s}
/* Diyalog */
#dialog{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);width:min(820px,94vw);background:var(--panel);border:2px solid var(--neon);border-radius:16px;padding:14px 18px;z-index:26;box-shadow:0 0 30px rgba(255,47,214,.35)}
#dialog .who{font-weight:800;color:var(--cyan);margin-bottom:6px;font-size:15px}
#dialog .txt{font-size:16px;line-height:1.45;min-height:44px}
#dialog .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#dialog .choices button{text-align:left}
#dialog .next{position:absolute;right:14px;bottom:8px;font-size:12px;color:var(--dim)}
/* Paneller */
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:2px solid #6c46d8;border-radius:18px;padding:16px;z-index:27;max-height:90vh;overflow:auto;box-shadow:0 0 40px rgba(108,70,216,.5)}
.panel h2{margin:0 0 10px;font-size:20px;color:#fff;text-shadow:0 0 8px var(--neon)}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.panel .close{position:absolute;right:12px;top:10px;padding:4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:#1d1048;border:1px solid #4b2fa0;border-radius:12px;padding:10px;font-size:13px}
.card.sel{border-color:var(--lime);box-shadow:0 0 10px var(--lime)}
.card b{display:block;font-size:14px;margin-bottom:4px}
/* Telefon */
#phone{width:min(400px,94vw);height:min(720px,90vh);border-radius:34px;border:6px solid #2a1a5a;padding:0;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#160c38,#0b0620)}
#phone .scr{flex:1;overflow:auto;padding:12px}
#phone .tabs{display:flex;justify-content:space-around;background:#0b0620;padding:8px 4px;border-top:1px solid #3b2a7a}
#phone .tabs button{padding:6px 8px;font-size:12px;border-radius:10px;border-width:1px}
#phone .tabs button.on{border-color:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#phone .status{display:flex;justify-content:space-between;padding:10px 18px 4px;font-size:12px;color:var(--dim)}
#phonemap{width:100%;aspect-ratio:1;border-radius:14px;background:#0b0620;border:1px solid #3b2a7a}
.msg{background:#21124f;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:13px}
.msg .f{color:var(--cyan);font-weight:700;font-size:12px}
/* Silah tekerleği */
#wheel{position:fixed;left:50%;top:50%;width:340px;height:340px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(20,10,50,.6) 30%,rgba(20,10,50,.92) 31%);border:3px solid #6c46d8;z-index:27}
#wheel .slot{position:absolute;width:96px;height:72px;margin:-36px 0 0 -48px;border-radius:14px;background:#1d1048;border:2px solid #4b2fa0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;text-align:center;pointer-events:auto}
#wheel .slot.sel{border-color:var(--lime);box-shadow:0 0 14px var(--lime)}
#wheel .slot .ic{font-size:24px}
#wheel .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:12px;color:var(--dim);width:130px}
/* Dokunmatik */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none}
#joy{position:absolute;left:4vw;bottom:5vh;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:auto}
#joyk{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(32,240,255,.35);border:2px solid var(--cyan)}
#tbtns{position:absolute;right:3vw;bottom:4vh;width:270px;height:270px;pointer-events:none}
.tb{position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(40,20,90,.6);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-align:center;pointer-events:auto;line-height:1}
.tb.big{width:78px;height:78px;font-size:13px;background:rgba(255,47,214,.35);border-color:var(--neon)}
.tb.on{background:rgba(182,255,59,.45)}
#ttop{position:absolute;top:200px;right:10px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#ttop .tb{position:static;width:50px;height:50px}
#lookpad{position:absolute;right:0;top:0;width:55%;height:100%;pointer-events:auto}
/* Admin */
#admin{width:min(980px,96vw)}
#admin table{width:100%;border-collapse:collapse;font-size:12px}
#admin td,#admin th{border-bottom:1px solid #3b2a7a;padding:5px;text-align:left;vertical-align:middle}
#admin .ok{color:var(--lime)} #admin .no{color:#ff7a9a}
#admin small{color:var(--dim)}
@media (max-width:760px){#stats{width:180px}#minimap{width:120px;height:120px}#objective{max-width:60vw;font-size:12px;top:auto;bottom:auto;top:8px}#hint{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="loading"><div class="logo">NEON <span>GÖLGELER</span></div><div class="sub">AÇIK DÜNYA · ELEMENT · ŞEHİR</div><div class="bar"><div class="fill" id="loadfill"></div></div><div class="sub" id="loadtxt">Başlatılıyor…</div></div>

</div>

<div id="cine"><div class="bar top"></div><div class="bar bot"></div><div class="ctitle" id="ctitle"></div><div class="sub" id="csub"></div><button class="skip hidden" id="cskip">Atla ⏭</button></div>

<div id="phone" class="panel hidden">

<div id="wheel" class="hidden"></div>

<script type="module">
// ============================================================================
//  NEON GÖLGELER — 3D Açık Dünya Hikayeli Aksiyon-Macera
//  Modüler tek-dosya yapı: Core · Data · Cache · Render · World · Figure ·
//  Input · Actors · Vehicles · UI · Missions · Main
// ============================================================================
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
const NG_VERSION = window.NG_BUILD || '0.0.0';

// ---------------------------------------------------------------- Yardımcılar
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (ax, az, bx, bz) => { const dx = ax - bx, dz = az - bz; return dx * dx + dz * dz; };
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI * 2)); if (d < 0) d += Math.PI * 2; return a + (d - Math.PI) * t; };
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const smooth = (t) => t * t * (3 - 2 * t);
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const IS_MOBILE = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const IS_ELECTRON = /Electron/i.test(navigator.userAgent);
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

// ---------------------------------------------------------------- Olay veriyolu
const Bus = {
  h: {},
  on(ev, fn) { (this.h[ev] ||= []).push(fn); return () => this.off(ev, fn); },
  off(ev, fn) { const a = this.h[ev]; if (a) { const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); } },
  emit(ev, data) { const a = this.h[ev]; if (a) for (const fn of a.slice()) { try { fn(data); } catch (e) { console.error('[Bus]', ev, e); } } }
};

// ---------------------------------------------------------------- Ayarlar
const SETTINGS_KEY = 'ng_settings_v2';
const Settings = Object.assign({
  quality: IS_MOBILE ? 'low' : 'high',   // low | medium | high
  viewDist: IS_MOBILE ? 260 : 420,
  shadows: true,
  bloom: !IS_MOBILE,
  modelMode: 'library',   // library (internetten hazır GLB) | block (blok figür)
  updateUrl: '',          // boşsa varsayılan GitHub kaynağı
  invertY: false,
  sens: 1.0,
  timeScale: 60,           // 1 gerçek saniye = 60 oyun saniyesi (1 oyun saati = 60 sn)
  volume: 0.6,
  showFps: true,
  touchForce: false
}, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'));
const saveSettings = () => localStorage.setItem(SETTINGS_KEY, JSON.stringify(Settings));

// ---------------------------------------------------------------- Oyun durumu
const SAVE_KEY = 'ng_save_v1';
function freshState() {
  return {
    version: 1,
    money: 150,
    reputation: 0,              // 0..100+
    isRecognizedNinja: false,   // 2.6 sonrası true
    wanted: 0,                  // 0..5
    bondLevel: 0,               // 0..100 (Ela Poyraz ile bağ)
    morality: 0,                // - sert/intikamcı · + koruyucu/birleştirici
    moralPath: null,            // 'vengeful' | 'protective'
    flags: {},
    abilities: { metal: true, shockwave: true, tornado: false, glide: false, dragon: false },
    completed: {},              // görev id -> true
    outfit: 'civil',            // 'civil' | 'ninja'
    mask: false,
    carried: ['fists'],         // taşınan silahlar (MAX_CARRY)
    storage: [],                // güvenli ev/garaj deposu
    equipped: 0,
    vehicles: [],               // sahip olunan araçlar [{uid,type,color,mods:{speed,armor,grip}}]
    safehouses: [],
    eggs: {},
    messages: [{ from: 'Hikmet Usta', text: 'Kaan, rıhtımda bu gece hareket var. Dikkatli ol evlat.', t: 0 }],
    allyWith: false,            // Ela yanımızda mı

function saveGame() {
  try {
    if (Game.player) S.pos = [Game.player.pos.x, Game.player.pos.y, Game.player.pos.z];
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    return true;
  } catch (e) { console.warn('Kaydetme hatası', e); return false; }
}
function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return false;
  try { S = Object.assign(freshState(), JSON.parse(raw)); return true; } catch (e) { return false; }
}
function logEvent(key, text) {
  S.eventLog.push({ key, text, day: S.day, t: S.time });
  if (S.eventLog.length > 30) S.eventLog.shift();
  Bus.emit('event', { key, text });
}
function addMessage(from, text) {
  S.messages.unshift({ from, text, t: S.time });
  if (S.messages.length > 40) S.messages.pop();
  UI && UI.toast('📱 ' + from + ': ' + text.slice(0, 60) + (text.length > 60 ? '…' : ''));
}
function changeBond(d, why) {
  S.bondLevel = clamp(S.bondLevel + d, 0, 100);
  if (d > 0) UI.toast(`💞 Bağ +${d}${why ? ' · ' + why : ''}`);
}
function changeRep(d) {
  const before = S.reputation;
  S.reputation = Math.max(0, S.reputation + d);
  if (Math.floor(before / 20) < Math.floor(S.reputation / 20)) UI.toast('⭐ Saygınlık seviyesi ' + Math.floor(S.reputation / 20), true);
}
function changeMoney(d) { S.money = Math.max(0, S.money + d); }
function changeMorality(d) { S.morality += d; }

// ============================================================================
//  ÖNBELLEK (IndexedDB) · SUPABASE (REST) · VARLIK YÖNETİCİSİ · OTOMATİK RİG
//  Her varlık: {id, slot, kind, fmt, version, updatedAt, url, source}
//  Açılışta: manifest ↔ IndexedDB kaydı karşılaştırılır; sürüm/damga aynıysa
//  blob indirilmeden doğrudan IndexedDB'den yüklenir, rig meta da önbellekten gelir.
// ============================================================================
const AssetCache = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res) => {
      if (!window.indexedDB) { res(null); return; }
      const rq = indexedDB.open('ng_cache', 2);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains('assets')) db.createObjectStore('assets', { keyPath: 'id' });
      };
      rq.onsuccess = () => { this.db = rq.result; res(this.db); };
      rq.onerror = () => { console.warn('IndexedDB açılamadı'); res(null); };
    });
  },
  async tx(mode, fn) {
    const db = await this.open(); if (!db) return null;
    return new Promise((res, rej) => {
      const t = db.transaction('assets', mode); const st = t.objectStore('assets');
      const r = fn(st); t.oncomplete = () => res(r && r.result !== undefined ? r.result : r); t.onerror = () => rej(t.error);
    });
  },
  get(id) { return this.tx('readonly', st => st.get(id)); },
  put(rec) { return this.tx('readwrite', st => st.put(rec)); },
  del(id) { return this.tx('readwrite', st => st.delete(id)); },
  clear() { return this.tx('readwrite', st => st.clear()); },
  all() { return this.tx('readonly', st => st.getAll()); }
};

// Çok parçalı modellerde arm_R, arm_L, leg_R, leg_L, head, torso node'larını bulur,
// eklem noktalarına pivot grupları kurar ve parçaları dünya dönüşümünü koruyarak bağlar.
const RIG_PATTERNS = {
  head: /^(head|kafa|bas)/i, torso: /^(torso|body|chest|govde)/i,
  arm_L: /^(arm|kol)[_.\-\s]?l(eft)?\b|^l(eft)?[_.\-\s]?arm/i, arm_R: /^(arm|kol)[_.\-\s]?r(ight)?\b|^r(ight)?[_.\-\s]?arm/i,
  leg_L: /^(leg|bacak)[_.\-\s]?l(eft)?\b|^l(eft)?[_.\-\s]?leg/i, leg_R: /^(leg|bacak)[_.\-\s]?r(ight)?\b|^r(ight)?[_.\-\s]?leg/i
};
function normalizeModel(root, targetH = 2.0) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const s = size.y > 0.0001 ? targetH / size.y : 1;
  const wrap = new THREE.Group();
  root.scale.multiplyScalar(s);
  root.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(root);
  const c = b2.getCenter(new THREE.Vector3());
  root.position.x -= c.x; root.position.z -= c.z; root.position.y -= b2.min.y;
  wrap.add(root);
  return wrap;
}
function normalizeVehicle(root, targetLen) {
  root.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(root), sz = b.getSize(new THREE.Vector3());
  const wrap = new THREE.Group(), inner = new THREE.Group(); inner.add(root); wrap.add(inner);
  if (sz.x > sz.z) inner.rotation.y = Math.PI / 2;               // uzun eksen ileri (+z) olsun
  const s = targetLen / Math.max(sz.x, sz.z, 0.001); inner.scale.setScalar(s);
  wrap.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(inner), c = b2.getCenter(new THREE.Vector3());
  inner.position.set(-c.x, -b2.min.y, -c.z);
  return wrap;
}

const CAST_LIB = { Elite: 'lib_robot', Boss_Architect: 'lib_robot', Police: 'lib_soldier', Guard: 'lib_soldier' };

function autoRig(wrap, cachedMeta) {
  wrap.updateMatrixWorld(true);
  const found = {};
  wrap.traverse(n => { if (!n.name) return; for (const k in RIG_PATTERNS) if (!found[k] && RIG_PATTERNS[k].test(n.name)) found[k] = n; });
  const meta = cachedMeta || {};
  const order = ['arm_L', 'arm_R', 'leg_L', 'leg_R', 'head', 'torso'];
  for (const k of order) {

    let joint;

      if (k === 'head') joint = new THREE.Vector3(c.x, b.min.y, c.z);
      else if (k === 'torso') joint = new THREE.Vector3(c.x, b.min.y + sz.y * 0.1, c.z);

  obj.traverse(n => { if (n.name && n.name.startsWith('pivot_')) parts[n.name.slice(6)] = n; });
  return parts;
}

    const kind = /png|jpe?g|webp/.test(fmt) ? 'texture' : 'model';
    const id = slot;
    const prev = this.manifest[id];
    const version = (prev?.version || 0) + 1;
    const updatedAt = new Date().toISOString();
    let url = '';
    let source = 'local';
    if (Supa.ok()) {
      try {
        const path = `${slot}/${version}_${file.name}`;
        url = await Supa.upload(path, file, file.type);
        await Supa.upsert({ id, slot, kind, fmt, url, version, updated_at: updatedAt, display_name: CAST[slot]?.name || slot });
        source = 'supabase';
      } catch (err) { UI.toast('Supabase yükleme başarısız, yerel kaydedildi: ' + err.message); }
    }
    this.manifest[id] = { id, slot, kind, fmt: fmt === 'gltf' ? 'glb' : fmt, url, version, updatedAt, source, name: file.name };
    this.saveManifest();
    await AssetCache.put({ id, slot, kind, fmt, version, updatedAt, blob: file, size: file.size, rigMeta: null, savedAt: Date.now() });
    await this.loadOne(id);
  },
  async refreshOne(id) {
    const e = this.manifest[id]; if (!e) return;
    if (e.url) await this.loadOne(id, true); else await this.loadOne(id);
  },
  async clearAndRescan() {
    await AssetCache.clear();
    this.templates = {}; this.textures = {}; this.status = {};
    await this.syncRemote();
    // Yerel-yalnız varlıklar (url yok) önbellek silinince kaybolur → manifestten düş
    for (const k of Object.keys(this.manifest)) if (!this.manifest[k].url) delete this.manifest[k];
    this.saveManifest();
    await this.loadAll();
    Bus.emit('assetsReset');
  },
  removeSlot(id) { delete this.manifest[id]; delete this.templates[id]; this.saveManifest(); AssetCache.del(id); Bus.emit('assetsReset'); }
};

// ---------------------------------------------------------------- Gün/Gece & Hava
const Sky = {
  wet: 0, rainAmt: 0, cloud: 0, flashT: 0, nextWeatherAt: 0, curfew: false, forced: null,
  keys: [ // saat, gökyüzü üst, ufuk, güneş rengi, hemi yoğunluk
    [0, '#07041a', '#3a0f5e', '#5a6cff', 0.35], [5, '#120a35', '#ff5fa0', '#ff8a5a', 0.45], [7, '#4a7fd8', '#ffc08a', '#ffd2a0', 0.8],
    [12, '#3a8fff', '#cfe8ff', '#ffffff', 1.0], [17, '#3a6fd8', '#ffb080', '#ffc080', 0.85], [19.5, '#2a1260', '#ff3fa0', '#ff5a7a', 0.55],
    [21, '#0b0628', '#5a1a7a', '#6a5cff', 0.4], [24, '#07041a', '#3a0f5e', '#5a6cff', 0.35]
  ],
  colA: new THREE.Color(), colB: new THREE.Color(),
  sample(h, idx) {
    const k = this.keys; let i = 0; while (i < k.length - 1 && k[i + 1][0] <= h) i++;
    const a = k[i], b = k[Math.min(i + 1, k.length - 1)]; const t = b[0] === a[0] ? 0 : (h - a[0]) / (b[0] - a[0]);
    if (idx === 4) return lerp(a[4], b[4], t);
    return this.colA.set(a[idx]).lerp(this.colB.set(b[idx]), t).clone();
  },
  setWeather(w, force) {
    S.weather = w; if (force) this.forced = w;
    if (w === 'rain' || w === 'storm') logEvent('rain', RADIO.news.rain); else if (w === 'clear') logEvent('clear', RADIO.news.clear);
  },
  update(dt) {
    const prevH = S.time;
    S.time += dt * Settings.timeScale / 3600;
    if (S.time >= 24) { S.time -= 24; S.day++; }
    const h = S.time;
    // Rastgele hava değişimi (görev zorlamıyorsa)
    if (!this.forced && Game.t > this.nextWeatherAt) {
      this.nextWeatherAt = Game.t + rand(140, 320);
      const r = Math.random(); this.setWeather(r < 0.45 ? 'clear' : r < 0.7 ? 'cloudy' : r < 0.92 ? 'rain' : 'storm');
    }
    const w = S.weather;
    const tRain = w === 'rain' ? 0.7 : w === 'storm' ? 1 : 0;
    const tCloud = w === 'cloudy' ? 0.55 : w === 'rain' ? 0.8 : w === 'storm' ? 1 : 0;
    this.rainAmt = lerp(this.rainAmt, tRain, dt * 0.4);
    this.cloud = lerp(this.cloud, tCloud, dt * 0.3);
    this.wet = tRain > 0 ? Math.min(1, this.wet + dt * 0.08) : Math.max(0, this.wet - dt * 0.012);
    // Güneş
    const ang = ((h - 6) / 12) * Math.PI;
    const sy = Math.sin(ang), sx = Math.cos(ang);
    const day = clamp(sy * 2.2 + 0.25, 0, 1);
    const night = 1 - day;
    SHARED_UNI.uNight.value = clamp(night * 1.1, 0, 1);
    SHARED_UNI.uWet.value = this.wet;
    const top = this.sample(h, 1), hor = this.sample(h, 2), sunC = this.sample(h, 3);
    const cloudGrey = new THREE.Color(0x2a2a38);
    top.lerp(cloudGrey, this.cloud * 0.6); hor.lerp(cloudGrey, this.cloud * 0.5);
    Render.skyMat.uniforms.top.value.copy(top); Render.skyMat.uniforms.hor.value.copy(hor);
    Render.skyMat.uniforms.sunCol.value.copy(sunC); Render.skyMat.uniforms.cloud.value = this.cloud;
    const sd = new THREE.Vector3(sx * 0.8, sy, 0.45).normalize();
    // Gece "ay" yönü ışığı: 80ler neon gecesi morumsu ay ışığı
    const lightDir = sy > -0.05 ? sd : new THREE.Vector3(-sx * 0.6, Math.max(0.3, -sy), -0.4).normalize();
    Render.skyMat.uniforms.sunDir.value.copy(sd);
    const p = Game.player ? Game.player.pos : _v1.set(0, 0, 0);
    // gölge kamerası oyuncuyu takip eder; texel'e hizalanır (titreme olmaz)
    const tx = (Render.shadowExt * 2) / Render.shadowRes, sx2 = Math.round(p.x / tx) * tx, sz2 = Math.round(p.z / tx) * tx;
    Render.sun.position.set(sx2 + lightDir.x * 150, p.y + lightDir.y * 150, sz2 + lightDir.z * 150);
    Render.sun.target.position.set(sx2, p.y, sz2);
    Render.sun.color.copy(sy > -0.05 ? sunC : new THREE.Color(0x8a7cff));
    Render.sun.intensity = (sy > -0.05 ? lerp(0.4, 2.6, day) : 0.55) * (1 - this.cloud * 0.55);
    Render.hemi.intensity = this.sample(h, 4) * (1 - this.cloud * 0.25) + 0.15;
    Render.hemi.color.copy(top).lerp(new THREE.Color(0xffffff), 0.5);
    Render.hemi.groundColor.set(night > 0.5 ? 0x3a1450 : 0x504060);
    Game.renderer.toneMappingExposure = lerp(1.25, 1.0, day);
    const fogC = hor.clone().lerp(new THREE.Color(0x101018), 0.35);
    Game.scene.fog.color.copy(fogC);
    Game.scene.fog.density = (1.75 / Settings.viewDist) * (1 + this.rainAmt * 0.9 + this.cloud * 0.2);
    if (Render.bloom) Render.bloom.strength = lerp(0.25, 0.75, SHARED_UNI.uNight.value) + Sky.wet * 0.1;
    Render.sky.position.copy(Game.camera.position);
    // Fırtına şimşeği
    if (w === 'storm') {
      this.flashT -= dt;
      if (this.flashT <= 0) { this.flashT = rand(4, 11); $('flash').style.transition = 'none'; $('flash').style.opacity = 0.55; setTimeout(() => { $('flash').style.transition = 'opacity .6s'; $('flash').style.opacity = 0; }, 80); }
    }
    Rain.update(dt, this.rainAmt);
  },
  isNight() { return S.time >= 19.5 || S.time < 5.5; },
  hourIn(a, b) { const h = S.time; return a <= b ? (h >= a && h <= b) : (h >= a || h <= b); },
  label() { const h = Math.floor(S.time), m = Math.floor((S.time % 1) * 60); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; },
  weatherIcon() { return { clear: this.isNight() ? '🌙' : '☀️', cloudy: '☁️', rain: '🌧', storm: '⛈' }[S.weather] || '☀️'; }
};

// ---------------------------------------------------------------- Yağmur (havuzlanmış çizgiler)
const Rain = {
  n: 0, mesh: null, pos: null,
  init() {
    this.n = Settings.quality === 'low' ? 900 : Settings.quality === 'medium' ? 1600 : 2600;
    const g = new THREE.BufferGeometry(); this.pos = new Float32Array(this.n * 6);
    for (let i = 0; i < this.n; i++) { const x = rand(-35, 35), y = rand(0, 30), z = rand(-35, 35); this.pos.set([x, y, z, x + 0.05, y - 0.7, z], i * 6); }
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    this.mesh = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xa8c8ff, transparent: true, opacity: 0.45, fog: false }));
    this.mesh.frustumCulled = false; this.mesh.visible = false;
    Game.scene.add(this.mesh);
  },
  update(dt, amt) {
    this.mesh.visible = amt > 0.03;
    if (!this.mesh.visible) return;

    g.fillStyle = '#2a2240'; for (const r of World.land) g.fillRect(r.x0, r.z0, r.x1 - r.x0, r.z1 - r.z0);

    g.stroke();
    const dot = (x, z, col, r = 5) => { g.fillStyle = col; g.beginPath(); g.arc(x, z, r / sc, 0, Math.PI * 2); g.fill(); };
    for (const m of Missions.markers) dot(m.x, m.z, m.color, 6);

      const done = () => { box.classList.add('hidden'); this._dlgAdvance = null; this._dlgChoices = null; Game.inputLock = Math.max(0, Game.inputLock - 1); if (Game.mode === 'dialog') Game.mode = prevMode === 'dialog' ? 'play' : prevMode; resolve(); };
      const show = () => {
        if (i >= q.length) return done();
        const L = q[i]; $('dch').innerHTML = ''; this._dlgChoices = null;
        if (L.choice) {
          $('dwho').textContent = 'Seçim'; $('dtxt').textContent = ''; $('dnext').style.display = 'none';

// ---------------------------------------------------------------- Etkileşim sistemi
const Interact = {
  cur: null,
  update() {
    const p = Game.player; if (!p || Game.mode !== 'play' || p.vehicle || p.dragon) { UI.prompt(p?.vehicle ? '' : ''); this.cur = null; return; }
    let best = null, bd = 1e9;
    const consider = (o, d) => { if (d < bd) { bd = d; best = o; } };
    for (const o of World.interact) { if (o.cond && !o.cond()) continue; const d = Math.sqrt(dist2(o.x, o.z, p.pos.x, p.pos.z)); if (d < o.r && Math.abs(p.pos.y - World.groundAt(o.x, o.z, p.pos.y + 1)) < 3) consider(o, d); }
    for (const m of Missions.markers) { const d = Math.sqrt(dist2(m.x, m.z, p.pos.x, p.pos.z)); if (d < 4.5 && Math.abs(p.pos.y - (m.y || 0)) < 4) consider({ label: (m.m.kind === 'activity' ? '💞 ' : m.m.kind === 'side' ? '◆ ' : '★ ') + (m.m.num ? m.m.num + ' ' : '') + m.m.title, action: () => Missions.start(m.m) }, d - 1); }
    for (const o of Missions.interacts) { const d = Math.sqrt(dist2(o.x, o.z, p.pos.x, p.pos.z)); if (d < (o.r || 3)) consider(o, d - 2); }
    for (const c of Population.civs) { if (!c.alive || c.ai.mode === 'flee') continue; const d = c.distTo(p); if (d < 2.2) consider({ label: 'Konuş', action: () => Population.civTalk(c) }, d + 1); }
    this.cur = best;
    const v = !best && Vehicles.nearest(p.pos, 4.2);
    UI.prompt(best ? `${Input.hint('interact')} ${best.label}` : v && !v.wreck ? `${Input.hint('vehicle')} ${v.def.name}'e bin` : '');
  },
  use() { if (this.cur) this.cur.action(); }
};

const Cutscene = {

    const prevMode = Game.mode; Game.mode = 'cutscene'; Game.inputLock++;
    $('cine').classList.add('on'); $('cskip').classList.remove('hidden'); $('touch').classList.add('hidden');
    if (document.pointerLockElement) document.exitPointerLock();

    // oyuncu kadrosu

      const [dx, dz, face, anim] = C.cast[k];

      else if (k === 'ela') { a = Ally.spawn(_v1.set(ax + dx, ay, az + dz)); a.hidden = false; }
      else { const had = Friends.list[k]; a = Friends.spawn(k, [ax, az], dx, dz); if (!had) temp.push(k); }

      if (a.dragon) Dragon.dismount();

      a.poseOverride = anim === 'ko' ? null : anim === 'idle' ? null : anim; if (anim === 'ko') { a.st.anim = 'ko'; a.alive = false; a.koT = 1; a._cineKO = true; }

    }
    if (C.title) { $('ctitle').textContent = C.title; $('ctitle').style.opacity = 1; setTimeout(() => $('ctitle').style.opacity = 0, 2500); }
    Cam.override = true;
    const cam = Game.camera, anchor = new THREE.Vector3(ax, ay, az);

      if (this.skipFlag) break;
      const tgtA = step.on && cast[step.on];
      const T = tgtA ? new THREE.Vector3(tgtA.pos.x, tgtA.pos.y + 1.5, tgtA.pos.z) : anchor.clone().add(_v1.set(0, 2, 0));
      const yaw = tgtA ? tgtA.yaw : 0, f = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)), rt = new THREE.Vector3(f.z, 0, -f.x);

        case 'over': p0 = T.clone().addScaledVector(f, -2.6).addScaledVector(rt, 1).add(_v1.set(0, 0.5, 0)); p1 = p0.clone().addScaledVector(f, 0.6); l0 = l1 = T.clone().addScaledVector(f, 6); break;
        case 'low': p0 = T.clone().addScaledVector(f, 4.5).add(_v1.set(0, -1.2, 0)).addScaledVector(rt, -1.5); p1 = p0.clone().addScaledVector(rt, 3); break;
        case 'top': p0 = T.clone().add(_v1.set(2, 13, 2)); p1 = T.clone().add(_v1.set(-1, 9, -1)); break;
        case 'sky': p0 = anchor.clone().add(_v1.set(38, 26, 38)); p1 = anchor.clone().add(_v1.set(-26, 34, 32)); l0 = anchor.clone().add(_v1.set(0, 6, 0)); l1 = l0.clone(); break;
        case 'orbit': p0 = null; break;
        default: p0 = T.clone().addScaledVector(f, 7).add(_v1.set(0, 2.2, 0)).addScaledVector(rt, 2); p1 = p0.clone().addScaledVector(rt, -4);
      }
      if (step.sub) $('csub').innerHTML = step.sub.text ? (step.sub.who ? `<b>${UI.speakerName(step.sub.who)}:</b> ` : '') + step.sub.text : '';
      const dur = (step.dur || 3) * 1000, t0 = performance.now();
      for (const k in step.anim || {}) if (cast[k]) cast[k].poseOverride = step.anim[k];
      await new Promise(res => {
        const tick = () => {

          if (step.shot === 'orbit') { const a = yaw + 0.6 + e * 1.6; cam.position.set(T.x + Math.sin(a) * 5.5, T.y + 1.2, T.z + Math.cos(a) * 5.5); cam.lookAt(T); }
          else { cam.position.lerpVectors(p0, p1, e); cam.lookAt(_v2.lerpVectors(l0, l1, e)); }
          if (k >= 1) return res(); requestAnimationFrame(tick);
        };
        tick();
      });
    }
    $('csub').innerHTML = ''; $('cine').classList.remove('on'); $('cskip').classList.add('hidden'); $('ctitle').style.opacity = 0;
    for (const k in cast) { const a = cast[k]; a.poseOverride = null; if (a._cineKO) { a.alive = true; a._cineKO = false; } }

  },

      if (m.kind === 'activity') return S.flags['cd_' + m.id] !== S.day && (!m.needAlly || S.allyUnlocked);

  },
  tryStartAt(at) { const m = this.available().find(x => x.at === at); if (m && !this.active) { this.start(m); return true; } return false; },
  // ---------------------------------------------------------- başlat
  async start(m) {
    if (this.active) { UI.toast('Önce aktif görevi bitir: ' + this.active.title); return; }

    if (m.needAlly && !S.allyWith) { UI.dialog([{ who: 'Bilgi', text: 'Bu aktivite için Ela yanında olmalı. Telefondan ara ' + Input.hint('callally') + '.' }]); return; }
    if (m.cost && S.money < m.cost) { UI.toast('Para yetersiz (' + m.cost + ' ₺ gerekli)'); return; }
    const hrs = m.hours || (m.night ? [20, 4.5] : null);
    if (hrs && !Sky.hourIn(hrs[0], hrs[1])) {
      let ok = false;
      await UI.dialog([{ who: 'Bilgi', text: `"${m.title}" ${m.night ? 'gece' : hrs[0] + ':00 sonrası'} başlar.` }, { choice: [{ text: '⏳ Bekle (saati ilerlet)', flag: '_wait' }, { text: 'Vazgeç' }] }]);

    }

    const tok = ++this.token; this.active = m; this.stepState = {};

// ============================================================================
//  AutoUpdater — oyun içi güncelleme (tam kurulum dosyası indirmeden)
//  version.json → { version, mandatory, notes, baseUrl, files:[{path,url?,sha256?,size?}],
//                   shell:{ minShell, exeUrl, apkUrl } }
//  Paket dosyaları SHA-256 ile doğrulanıp servis çalışanı önbelleğine ('ng-pkg') yazılır;
//  sonraki açılışta yeni dosyalar yerleşik olanların yerine sunulur. Kabuk (Electron/APK)
//  sürümü gerekiyorsa electron-updater / APK indirme kancası devreye girer.

const PKG_VER_KEY = 'ng_pkg_ver';
const DEFAULT_UPDATE_URLS = [
  'https://raw.githubusercontent.com/hllakbnr/neon-golgeler/main/game/version.json',
  'https://cdn.jsdelivr.net/gh/hllakbnr/neon-golgeler@main/game/version.json'
];
const SHELL = (() => {
  const q = new URLSearchParams(location.search).get('shell');
  if (window.ngShell) return { kind: 'electron', version: window.ngShell.version };
  if (q && q.startsWith('apk-')) return { kind: 'apk', version: q.slice(4) };
  return { kind: 'web', version: NG_VERSION };
})();
const cmpVer = (a, b) => { const x = String(a || '0').split('.').map(Number), y = String(b || '0').split('.').map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0 ? 1 : -1; } return 0; };

const AutoUpdater = {
  swOk: false, busy: false, latest: null,
  get current() { return NG_VERSION; },
  async init() {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;

      if (pkg) {

  },
  urls() {

    if (Supa.ok()) u.push(Supa.publicUrl('version.json'));
    return u.concat(DEFAULT_UPDATE_URLS);
  },
  async fetchManifest() {
    for (const u of this.urls()) {

  async check(manual) {

    this.latest = m;

  prompt(m) {

    const el = $('updater');
    el.innerHTML = `<h2>⬇ Yeni sürüm: ${m.version}</h2><p style="color:var(--dim);font-size:13px">Yüklü sürüm: ${this.current}${m.mandatory ? ' · <b style="color:#ff7a9a">Zorunlu güncelleme</b>' : ''}</p>
      <div class="card" style="white-space:pre-wrap;max-height:30vh;overflow:auto">${(m.notes || 'İyileştirmeler ve hata düzeltmeleri.').replace(/</g, '&lt;')}</div>
      ${needShell ? `<p style="color:#ffb020;font-size:13px">Bu sürüm yeni bir ${SHELL.kind === 'apk' ? 'uygulama (APK)' : 'masaüstü kabuğu'} gerektiriyor.</p>` : ''}
      <div class="barw" style="margin:12px 0 4px"><div id="updbar" style="width:0%;background:linear-gradient(90deg,var(--neon),var(--cyan));height:100%"></div></div><div id="updtxt" style="font-size:12px;color:var(--dim)"></div>
      <div class="row" style="margin-top:10px">${UI.btn(needShell ? '⬇ Uygulamayı güncelle' : '⬇ Şimdi güncelle ve yeniden başlat', () => needShell ? this.shellUpdate(m) : this.apply(m), 'alt')}${m.mandatory ? '' : UI.btn('Sonra', () => { el.classList.add('hidden'); Game.inputLock = Math.max(0, Game.inputLock - 1); })}</div>`;

        if (!r.ok) throw new Error(f.path + ' indirilemedi (' + r.status + ')');
        const buf = await r.arrayBuffer();
        if (f.sha256) { const h = await this.sha256(buf); if (h !== f.sha256) throw new Error(f.path + ' bütünlük doğrulaması başarısız'); }
        const type = /\.html$/.test(f.path) ? 'text/html; charset=utf-8' : /\.m?js$/.test(f.path) ? 'text/javascript; charset=utf-8' : /\.json$/.test(f.path) ? 'application/json' : /\.wasm$/.test(f.path) ? 'application/wasm' : 'application/octet-stream';
        const path = new URL(f.path, location.href).pathname;
        await stage.put(path, new Response(buf, { headers: { 'Content-Type': type } }));
        done += f.size || 1; bar.style.width = Math.round(done / total * 100) + '%';
      }
      // önbellekleri değiştir (atomik)
      txt.textContent = 'Uygulanıyor…';
      await caches.delete('ng-pkg'); const live = await caches.open('ng-pkg');
      for (const req of await stage.keys()) await live.put(req, await stage.match(req));
      await caches.delete('ng-pkg-staging');
      localStorage.setItem(PKG_VER_KEY, m.version);
      saveGame && Game.player && saveGame();
      txt.textContent = 'Yeniden başlatılıyor…'; await wait(600);
      this.restart();
    } catch (e) { txt.textContent = '✗ ' + e.message; UI.toast('Güncelleme başarısız: ' + e.message); }
    this.busy = false;
  },
  restart() { if (window.ngShell && window.ngShell.relaunch) window.ngShell.relaunch(); else location.reload(); },
  async rollback() { if (this.swOk) await caches.delete('ng-pkg'); localStorage.removeItem(PKG_VER_KEY); UI.toast('Yerleşik sürüme dönülüyor…'); setTimeout(() => this.restart(), 600); },
  shellUpdate(m) {
    if (SHELL.kind === 'electron' && window.ngShell.checkShellUpdate) { window.ngShell.checkShellUpdate(); UI.toast('Masaüstü güncellemesi indiriliyor; bitince oyun yeniden başlayacak.'); return; }
    const url = SHELL.kind === 'apk' ? m.shell?.apkUrl : m.shell?.exeUrl;
    if (url) location.href = url; else UI.toast('İndirme bağlantısı bulunamadı');
  }
};
// ============================================================================
//  ANA DÖNGÜ — yükleme, başlık menüsü, yeni oyun/devam, sistem güncelleme sırası
// ============================================================================
const Main = {
  fps: 60, last: 0, acc: 0, frames: 0, fpsT: 0, saveT: 0,
  async init() {
    const fill = $('loadfill'), txt = $('loadtxt');
    const prog = (k, t) => { fill.style.width = Math.round(k * 100) + '%'; if (t) txt.textContent = t; };
    try {
      prog(0.02, 'Renderer hazırlanıyor…');
      Render.init(); Input.init(); UI.init(); Projectiles.init();
      prog(0.08, 'Önbellek (IndexedDB) açılıyor…');
      await AssetCache.open();
      if (Supa.ok()) { prog(0.1, 'Supabase sürüm kontrolü…'); await AssetManager.syncRemote(); }
      prog(0.12, 'Varlıklar önbellekten yükleniyor…');
      await AssetManager.loadAll((k) => prog(0.12 + k * 0.18));
      prog(0.3, 'Hazır 3D modeller (önbellek / internet)…');
      await AssetManager.loadLibrary((k) => prog(0.3 + k * 0.1, 'Hazır 3D modeller… ' + Math.round(k * 100) + '%'));
      prog(0.4, 'Şehir inşa ediliyor…'); await wait(16);
      World.build((k) => prog(0.4 + k * 0.52, 'Şehir inşa ediliyor… ' + Math.round(k * 100) + '%'));
      prog(0.96, 'Gölgeler ısınıyor…');
      Game.camera.position.set(-300, 60, 560); Game.camera.lookAt(-320, 0, 480);
      Sky.update(0.016); Game.renderer.render(Game.scene, Game.camera);
      prog(1, 'Hazır');
    } catch (e) { console.error(e); txt.textContent = 'Başlatma hatası: ' + e.message; return; }
    $('loading').classList.add('hidden');
    this.title();
    AutoUpdater.init().then(() => setTimeout(() => AutoUpdater.check(false), 1500));
    this.last = performance.now(); requestAnimationFrame((t) => this.loop(t));
    document.addEventListener('visibilitychange', () => { if (document.hidden && Game.mode === 'play' && !Game.paused) { saveGame(); UI.pause(); } });
    addEventListener('beforeunload', () => { if (Game.player) saveGame(); });
  },
  title() {
    $('title').classList.remove('hidden');
    const has = !!localStorage.getItem(SAVE_KEY);
    $('btnContinue').style.display = has ? '' : 'none';
    $('btnContinue').onclick = () => this.start(false);
    $('btnNew').onclick = () => { if (has) { if (!$('btnNew').dataset.confirm) { $('btnNew').dataset.confirm = 1; $('btnNew').textContent = '⚠ Kayıt silinecek — tekrar bas'; return; } } this.start(true); };
    $('btnSettings').onclick = () => UI.settings();
    $('btnAdmin').onclick = () => UI.admin();
  },
  start(isNew) {
    Sound.init();
    if (isNew) { S = freshState(); localStorage.removeItem(SAVE_KEY); } else loadGame();
    $('title').classList.add('hidden'); $('hud').classList.remove('hidden');
    const sp = S.pos || [LOC.harborGate[0], 0, LOC.harborGate[1]];
    const pl = Player.create(_v1.set(sp[0], World.groundAt(sp[0], sp[2], (sp[1] || 0) + 1), sp[2]));
    pl.yaw = Math.PI;
    if (S.allyWith) { Ally.spawn(_v1.set(sp[0] + 2, pl.pos.y, sp[2] + 2)); }
    if (S.vehicles.length && !isNew) Vehicles.deliver(S.vehicles[0], [sp[0] + 6, sp[2] + 4]);
    if (S.flags.curfew) Sky.curfew = true;
    Eggs.setup();
    Bus.on('modelLoaded', () => { clearTimeout(this._rb); this._rb = setTimeout(() => this.rebuildFigures(), 50); });
    Cam.yaw = Math.PI * 1.2; Cam.snap();
    Game.mode = 'play'; UI.updateHint();
    $('touch').classList.toggle('hidden', Input.device !== 'touch');
    Missions.refreshMarkers();
    if (isNew) setTimeout(() => Missions.start(MISSIONS[0]), 400);
    else UI.toast('Hoş geldin, ' + CAST.Hero_Main.name + '. Kaldığın yerden devam.');
  },
  rebuildFigures() {
    for (const a of Game.actors) { a.fig.rebuild(); if (a.kind === 'player') a.fig.setMask(S.mask); }
    for (const v of Game.vehicles) { if (AssetManager.templates['veh_' + v.type]) { Game.scene.remove(v.mesh); v.mesh = v.build(); Game.scene.add(v.mesh); } }
  },
  loop(t) {
    requestAnimationFrame((tt) => this.loop(tt));
    let dt = (t - this.last) / 1000; this.last = t; if (dt > 0.05) dt = 0.05; if (dt <= 0) dt = 0.001;
    this.frames++; this.fpsT += dt; if (this.fpsT > 0.5) { this.fps = this.frames / this.fpsT; this.frames = 0; this.fpsT = 0; }
    Game.dt = dt;
    Input.poll();
    UI.update(dt);
    if (Game.mode === 'title' || !Game.player) { Game.t += dt; SHARED_UNI.uTime.value = Game.t; Sky.update(dt * 0.2); this.titleCam(dt); Render.draw(); return; }
    if (!Game.paused) {
      Game.t += dt; SHARED_UNI.uTime.value = Game.t;
      Sky.update(dt);
      Player.update(dt);
      Ally.update(dt);
      Friends.update(dt);
      Enemies.update(dt);
      for (const a of Game.actors.slice()) if (!a.removed) a.update(dt);
      Vehicles.updateTraffic(dt);
      Vehicles.updateAll(dt);
      Crime.update(dt);
      Population.update(dt);
      Projectiles.update(dt);
      FX.update(dt);
      Pickups.update(dt);
      Missions.update(dt);
      Interact.update();
      LightPool.update(dt);
      this.saveT += dt; if (this.saveT > 60 && Game.mode === 'play') { this.saveT = 0; saveGame(); }
    }
    World.updateCulling();
    Cam.update(dt);
    Render.draw();
  },
  titleCam(dt) {
    const a = Game.t * 0.05, c = Game.camera;
    c.position.set(Math.cos(a) * 260, 70 + Math.sin(a * 0.7) * 20, Math.sin(a) * 260); c.lookAt(0, 20, 0);
    Render.sky.position.copy(c.position);
    World.updateCulling();
  }
};
// Hata ayıklama kancası (konsoldan: __NG.S, __NG.Missions …)
window.__NG = { get S() { return S; }, Bus, Game, Missions, Player, Ally, World, Vehicles, Enemies, Crime, Cutscene, UI, Input, Sky, Friends, Pickups, Eggs, Population, Main, AssetManager, AssetCache, Supa, Dragon, Combat, Cam, AutoUpdater, MISSIONS, SIDES, ACTIVITIES, EGGS, LOC, CAST, saveGame };
Main.init();

</script>
