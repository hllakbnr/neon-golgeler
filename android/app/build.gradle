plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
  namespace 'com.neongolgeler.game'
  compileSdk 34
  defaultConfig { applicationId "com.neongolgeler.game"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0"; ndk { abiFilters "arm64-v8a", "armeabi-v7a" } }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
  androidResources { noCompress 'glb', 'js', 'html', 'json' }
}
dependencies { implementation "org.mozilla.geckoview:geckoview:125.+" }
