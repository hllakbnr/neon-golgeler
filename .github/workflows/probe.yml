name: Probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir z && cd z
          for f in kenney_car-kit_3.0.zip kenney_car-kit.zip kenney_blocky-characters_2.0.zip kenney_mini-characters.zip kenney_city-kit-commercial_2.1.zip kenney_city-kit-commercial.zip kenney_city-kit-roads.zip kenney_city-kit-suburban.zip kenney_city-kit-industrial.zip kenney_toy-car-kit.zip kenney_brick-kit.zip; do
            code=$(curl -sL -A "Mozilla/5.0" -o $f -w '%{http_code}' https://opengameart.org/sites/default/files/$f); echo "== $f $code $(stat -c%s $f)"
            if [ "$code" = 200 ]; then unzip -l $f | grep -iE '\.glb|\.png' | head -60; fi
          done
