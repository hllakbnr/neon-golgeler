name: Probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for f in kenney_car-kit_3.0.zip kenney_blocky-characters_2.0.zip kenney_mini-characters.zip; do
            curl -sL -A "Mozilla/5.0" -o /tmp/$f https://opengameart.org/sites/default/files/$f
            d=${f%.zip}; mkdir $d; (cd $d && unzip -q /tmp/$f 'Models/GLB format/*' 'Preview*' || true)
          done
          git init -q; git checkout -q -b asset-probe; git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm probe
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} asset-probe
