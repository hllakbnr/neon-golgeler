name: Godot deneme sürümü (exe + ekran görüntüleri)
on:
  push:
    branches: [main]
    paths: ['godot/**', '.github/workflows/godot.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3 + dışa aktarma şablonları
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable /tmp/tpl
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Ücretsiz varlıkları indir (Poly Haven CC0, Kenney CC0, Google Fonts OFL)
        run: |
          pip install -q pillow || true
          python3 godot/tools/fetch_assets.py
      - name: Türkçe diyalog seslendirme (Piper TTS)
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null || true
          pip install -q piper-tts || true
          python3 godot/tools/make_voices.py || true
          ls -la godot/assets/voice || true
      - name: Varlıkları içe aktar
        working-directory: godot
        run: |
          timeout 900 godot --headless --import 2>&1 | grep -v "^$" | tail -40 || true
          timeout 600 godot --headless --editor --quit 2>&1 | grep -iE "error|warning|parse" | head -60 || true
      - name: Betik denetimi
        working-directory: godot
        run: |
          fail=0
          for f in scripts/*.gd; do
            out=$(timeout 60 godot --headless --check-only --script "res://$f" 2>&1 | grep -iE "SCRIPT ERROR|Parse Error|error" | grep -vE "Can't open|Identifier not found: Game|Failed to load script" || true)
            if [ -n "$out" ]; then echo "== $f"; echo "$out"; fail=1; fi
          done
          echo "betik_hata=$fail"
      - name: Windows .exe dışa aktar
        working-directory: godot
        run: |
          mkdir -p build
          timeout 900 godot --headless --export-release "Windows Desktop" build/NeonGolgeler.exe 2>&1 | tail -30
          ls -la build
      - name: Ekran görüntüleri (yazılım Vulkan)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 > /dev/null
          mkdir -p shots
          timeout 1500 xvfb-run -a -s "-screen 0 1600x900x24" godot --path godot --rendering-driver vulkan --resolution 1600x900 -- --shots=$PWD/shots 2>&1 | grep -vE "^\s*$" | tail -80 || true
          ls -la shots || true
      - name: Ekran görüntülerini ci-shots dalına gönder
        if: always()
        run: |
          cd shots && ls *.png >/dev/null 2>&1 || exit 0
          for f in *.png; do convert "$f" -quality 85 "${f%.png}.jpg" 2>/dev/null && rm "$f" || true; done
          git init -q -b ci-shots && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Ekran görüntüleri #${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots
      - uses: actions/upload-artifact@v4
        with: { name: NeonGolgeler-Godot-Windows, path: godot/build/NeonGolgeler.exe }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-deneme-${{ github.run_number }}
          name: Godot deneme ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: godot/build/NeonGolgeler.exe
