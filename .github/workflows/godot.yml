name: Godot deneme sürümü (exe + ekran görüntüleri)
on:
  push:
    branches: [main]
    paths: ['godot/**', '.github/workflows/godot.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3 + dışa aktarma şablonları
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable /tmp/tpl
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Hızlı betik denetimi (hata varsa hemen dur)
        working-directory: godot
        run: |
          timeout 300 godot --headless --editor --quit > /tmp/ed.txt 2>&1 || true
          fail=0
          for f in scripts/*.gd; do
            out=$(timeout 60 godot --headless --check-only --script "res://$f" 2>&1 | grep -E "SCRIPT ERROR|Parse Error" | grep -vE "Can't open|Identifier not found: Game|Failed to load script|Compile Error: *$" || true)
            if [ -n "$out" ]; then echo "== $f"; echo "$out"; fail=1; fi
          done
          grep -E "Parse Error|SCRIPT ERROR" /tmp/ed.txt | head -20 || true
          if [ "$fail" = "1" ]; then echo "Betik hatası var, derleme durduruldu"; exit 1; fi
      - name: Ücretsiz varlıkları indir (Poly Haven CC0, Kenney CC0, Google Fonts OFL)
        run: |
          pip install -q pillow || true
          python3 godot/tools/fetch_assets.py
      - name: Dünya verisi (kıta, yollar, şehir, harita)
        run: |
          pip install -q numpy scipy pillow
          python3 godot/tools/make_world.py
          ls -la godot/data
      - name: Sürüm numarası
        run: |
          echo "${{ github.run_number }}" > godot/version.txt
          cat godot/version.txt
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/tts
          key: xtts-v2-model
      - name: Türkçe diyalog seslendirme (XTTS v2, yedek Piper)
        env: { COQUI_TOS_AGREED: "1" }
        run: |
          sudo apt-get update -qq > /dev/null || true
          sudo apt-get install -y -qq ffmpeg > /dev/null || true
          pip install -q "torch==2.5.1" "torchaudio==2.5.1" --index-url https://download.pytorch.org/whl/cpu || true
          pip install -q coqui-tts "transformers>=4.43,<4.50" "torch==2.5.1" "torchaudio==2.5.1" --extra-index-url https://download.pytorch.org/whl/cpu || true
          python -c "import TTS, transformers, torch; print('TTS', TTS.__version__, 'transformers', transformers.__version__, 'torch', torch.__version__)" || true
          pip install -q piper-tts edge-tts || true
          timeout 1500 python godot/tools/make_voices.py || true
          ls -la godot/assets/voice || true
      - name: Radyo müzikleri (prosedürel beste, telifsiz)
        run: |
          pip install -q numpy scipy || true
          timeout 900 python godot/tools/make_music.py || true
          ls -la godot/assets/music || true
      - name: Varlıkları içe aktar
        working-directory: godot
        run: |
          timeout 900 godot --headless --import 2>&1 | grep -v "^$" | tail -40 || true
          timeout 600 godot --headless --editor --quit 2>&1 | grep -iE "error|warning|parse" | head -60 || true
      - name: Betik denetimi
        working-directory: godot
        run: |
          fail=0
          for f in scripts/*.gd; do
            out=$(timeout 60 godot --headless --check-only --script "res://$f" 2>&1 | grep -iE "SCRIPT ERROR|Parse Error|error" | grep -vE "Can't open|Identifier not found: Game|Failed to load script|Compile Error: *$" || true)
            if [ -n "$out" ]; then echo "== $f"; echo "$out"; fail=1; fi
          done
          echo "betik_hata=$fail"
      - name: Windows .exe dışa aktar
        working-directory: godot
        run: |
          mkdir -p build
          timeout 900 godot --headless --export-release "Windows Desktop" build/NeonGolgeler.exe 2>&1 | tail -30
          ls -la build
      - name: Ekran görüntüleri (yazılım Vulkan)
        id: shots
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 > /dev/null
          mkdir -p shots
          cp /tmp/00_dokular.png shots/ 2>/dev/null || true
          timeout 3300 xvfb-run -a -s "-screen 0 1600x900x24" godot --path godot --rendering-driver vulkan --resolution 1600x900 -- --shots=$PWD/shots 2>&1 | grep -vE "^\s*$" | tail -120 || true
          ls -la shots || true
          if [ -f shots/15_duraklat.png ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: Ekran görüntülerini ci-shots dalına gönder
        if: always()
        run: |
          cd shots && ls *.png >/dev/null 2>&1 || exit 0
          for f in *.png; do convert "$f" -quality 85 "${f%.png}.jpg" 2>/dev/null && rm "$f" || true; done
          git init -q -b ci-shots && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Ekran görüntüleri #${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots
      - uses: actions/upload-artifact@v4
        with: { name: NeonGolgeler-Godot-Windows, path: godot/build/NeonGolgeler.exe }
      - name: Güncelleme bilgisi (version.json)
        if: steps.shots.outputs.ok == '1'
        run: |
          printf '{"version": %s, "file": "NeonGolgeler.exe", "notes": "Neon Gölgeler sürüm %s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" > godot/build/version.json
          cat godot/build/version.json
      - uses: softprops/action-gh-release@v2
        if: steps.shots.outputs.ok == '1'
        with:
          tag_name: godot-deneme-${{ github.run_number }}
          name: Godot deneme ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: godot/build/NeonGolgeler.exe
      # oyun içi güncelleyici her zaman bu sabit etiketten okur
      - uses: softprops/action-gh-release@v2
        if: steps.shots.outputs.ok == '1'
        with:
          tag_name: godot-guncel
          name: Neon Gölgeler (otomatik güncelleme)
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            godot/build/NeonGolgeler.exe
            godot/build/version.json
